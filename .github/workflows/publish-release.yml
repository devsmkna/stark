name: Pubblica release

# Un tag `vX.Y.Z` è una release (docs/rilascio.md) — un push su `main` non deve
# chiamare nessuno. Per ogni piattaforma supportata, questa pipeline fa una volta sola
# quello che prima faceva ogni singola macchina che installava: `npm ci` e
# `npm run ui:build`. Il risultato è un bundle già pronto, pubblicato su starkapp.dev —
# vedi docs/distribuzione.md per il perché e per come installer/`stark update` lo usano.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          # Non macos-13: quel parco runner Intel di GitHub è in restringimento (la
          # coda su questo job è restata vuota per minuti, run 33973707683, mentre
          # darwin-arm64 sotto finiva in meno di un minuto). Non serve macOS vero per
          # questo lavoro — `npm run ui:build` è JS puro, e l'unico pezzo per
          # piattaforma è l'eseguibile di Claude Code, che npm sceglie da un
          # `optionalDependencies` — quindi si builda su Linux **forzando** a chi
          # npm deve credere di rivolgersi. Verificato dal vivo, non dedotto: `npm ci
          # --os=darwin --cpu=x64` scarica `claude-agent-sdk-darwin-x64` anche su
          # questa macchina Linux.
          - target: darwin-x64
            runner: ubuntu-24.04
            npmOs: darwin
            npmCpu: x64
          - target: darwin-arm64
            runner: macos-14
          - target: win-x64
            runner: windows-2022
          # Stesso trucco di darwin-x64 qui sopra, verificato allo stesso modo: non
          # c'è (ancora) un runner GitHub-hosted nativo win-arm64, ma non serve —
          # `npm ci --os=win32 --cpu=arm64` porta a casa `claude-agent-sdk-win32-arm64`
          # da Linux. Prima di questa riga il bundle per questa piattaforma non
          # esisteva affatto (install.ps1 lo diceva invece di fingere).
          - target: win-arm64
            runner: ubuntu-24.04
            npmOs: win32
            npmCpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      # `ci` e non `install`: qui la cartella è appena clonata, quindi non c'è nessun
      # lockfile da rispettare più del solito, ed è più veloce. **Non** `--omit=dev`
      # qui: `vite` — il comando che `npm run ui:build` lancia — è lui stesso una
      # devDependency, quindi ometterla prima di compilare toglie di mezzo l'attrezzo
      # con cui si compila (misurato: `sh: 1: vite: not found` su ogni piattaforma,
      # run 33973387334). L'omissione arriva **dopo**, con `npm prune`, quando la UI
      # è già compilata e serve solo alleggerire il bundle di ciò che non gira più.
      #
      # `--os`/`--cpu` solo per le voci della matrix che li dichiarano (il campo non
      # è nemmeno definito per le altre, quindi la condizione bash è la cosa più
      # leggibile — un'espressione GitHub Actions con format() qui sarebbe la stessa
      # logica scritta più difficile da leggere). Vanno passati **due volte**, a `ci`
      # e a `prune`: `prune` da solo ricontrolla contro la piattaforma vera della
      # macchina e toglierebbe il pacchetto appena scaricato — misurato, non dedotto.
      - name: Installa
        shell: bash
        run: |
          if [ -n "${{ matrix.npmOs }}" ]; then
            npm ci --os="${{ matrix.npmOs }}" --cpu="${{ matrix.npmCpu }}"
          else
            npm ci
          fi
      - run: npm run ui:build
      - name: Alleggerisce (via le devDependencies)
        shell: bash
        run: |
          if [ -n "${{ matrix.npmOs }}" ]; then
            npm prune --omit=dev --os="${{ matrix.npmOs }}" --cpu="${{ matrix.npmCpu }}"
          else
            npm prune --omit=dev
          fi
      # Un formato solo (`tar.gz`) su ogni piattaforma, Windows compreso — `install.ps1`
      # lo estrae con lo stesso `tar` che Windows include dalla 1803 in poi, invece di
      # un secondo formato da gestire solo lì. Niente `--strip-components`: il
      # contenuto dell'archivio è già quello che deve finire dentro `$APP`.
      - name: Pacchetto
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/stark-${{ matrix.target }}.tar.gz" \
            src ui/dist node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: version.txt — quello che install.sh/stark update confrontano
        run: echo "$GITHUB_REF_NAME" > bundles/version.txt
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STARK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STARK_DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      # Due copie: `releases/<tag>/` per chi vuole un bundle preciso (a mano, o un
      # giorno per una lista di versioni), `releases/latest/` per install.sh e
      # `stark update`, che non sanno né devono sapere quale sia il tag più recente
      # prima di chiederlo. `/opt/stark-cloud/www` è la cartella che il container
      # `home` (nginx, dietro Traefik) serve già su `starkapp.dev` — non un webserver
      # nuovo, vedi docs/distribuzione.md. La chiave di deploy è ristretta con
      # `rrsync` a quella cartella e basta.
      # L'IP diretto e non l'hostname: `starkapp.dev` è dietro Cloudflare proxato
      # (utile per il CDN sui bundle), e l'SSH su quell'hostname non arriva da
      # nessuna parte — Cloudflare inoltra solo HTTP(S).
      - name: Pubblica su starkapp.dev
        run: |
          rsync -av --delete bundles/ "deploy@45.77.53.112:/opt/stark-cloud/www/releases/$GITHUB_REF_NAME/"
          rsync -av --delete bundles/ "deploy@45.77.53.112:/opt/stark-cloud/www/releases/latest/"
