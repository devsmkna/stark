name: Pubblica release

# Un tag `vX.Y.Z` è una release (docs/rilascio.md) — un push su `main` non deve
# chiamare nessuno. Per ogni piattaforma supportata, questa pipeline fa una volta sola
# quello che prima faceva ogni singola macchina che installava: `npm ci` e
# `npm run ui:build`. Il risultato è un bundle già pronto, pubblicato su starkapp.dev —
# vedi docs/distribuzione.md per il perché e per come installer/`stark update` lo usano.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          # Non macos-13: quel parco runner Intel di GitHub è in restringimento (la
          # coda su questo job è restata vuota per minuti, run 33973707683, mentre
          # darwin-arm64 sotto finiva in meno di un minuto). Si builda su Linux, ma
          # **non** forzando `--os`/`--cpu` sull'intero `npm ci`: `vite` in questo
          # progetto usa `rolldown`, che ha un binario nativo **per sé stesso** — non
          # per il bundle finale — e forzare la piattaforma su tutto l'albero fa
          # scaricare la variante *darwin* di quel binario invece di quella *linux*
          # che serve a eseguire `vite build` proprio su questa macchina (misurato:
          # `Cannot find module '@rolldown/binding-...'`, run 33978292094). Il
          # binario di Claude Code — l'unico pezzo che deve davvero essere per
          # `darwin-x64` — si scarica **a parte**, vedi lo step «Sostituisce il
          # binario di Claude Code» più sotto.
          - target: darwin-x64
            runner: ubuntu-24.04
            npmOs: darwin
            npmCpu: x64
          - target: darwin-arm64
            runner: macos-14
          - target: win-x64
            runner: windows-2022
          # Stesso ragionamento di darwin-x64 qui sopra: non c'è (ancora) un runner
          # GitHub-hosted nativo win-arm64. Prima di questo cambio il bundle per
          # questa piattaforma non esisteva affatto (install.ps1 lo diceva invece di
          # fingere).
          - target: win-arm64
            runner: ubuntu-24.04
            npmOs: win32
            npmCpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      # `ci` e non `install`: qui la cartella è appena clonata, quindi non c'è nessun
      # lockfile da rispettare più del solito, ed è più veloce. **Non** `--omit=dev`
      # qui: `vite` — il comando che `npm run ui:build` lancia — è lui stesso una
      # devDependency, quindi ometterla prima di compilare toglie di mezzo l'attrezzo
      # con cui si compila (misurato: `sh: 1: vite: not found` su ogni piattaforma,
      # run 33973387334). L'omissione arriva **dopo**, con `npm prune`, quando la UI
      # è già compilata e serve solo alleggerire il bundle di ciò che non gira più.
      #
      # Niente `--os`/`--cpu` qui: questa `npm ci` deve risolvere tutto per la
      # macchina **vera** che sta girando, `rolldown` compreso — vedi il commento
      # sulla voce `darwin-x64` della matrix qui sopra per il perché.
      - run: npm ci
      - run: npm run ui:build
      - run: npm prune --omit=dev
      # Per le due piattaforme «finte» (buildate su Linux ma destinate a un'altra):
      # `npm ci` ha appena installato `claude-agent-sdk-linux-x64` (quello giusto per
      # QUESTA macchina, sbagliato per il bundle) — va tolto e sostituito con quello
      # vero. Non lo si scarica con un `npm install <pacchetto>@<versione> --os=…
      # --cpu=…` diretto: quella strada dà `EBADPLATFORM` (misurato, run locale) —
      # il controllo di piattaforma sull'installazione di un singolo pacchetto non
      # segue gli stessi override di un `npm ci` sull'intero progetto. Si scarica
      # invece con un secondo `npm ci` **isolato**, in una copia a parte di
      # `package.json`/`package-lock.json` dove l'override è l'unica cosa che deve
      # risolvere — la stessa tecnica di prima, ma senza lasciarla toccare `rolldown`
      # o qualunque altro attrezzo di build di questa cartella.
      - name: Sostituisce il binario di Claude Code (piattaforme buildate incrociate)
        if: matrix.npmOs != ''
        shell: bash
        run: |
          SDK_VERSION="$(node -p "require('./node_modules/@anthropic-ai/claude-agent-sdk/package.json').version")"
          rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-*
          mkdir -p /tmp/harvest
          cp package.json package-lock.json /tmp/harvest/
          (cd /tmp/harvest && npm ci --omit=dev --ignore-scripts \
            --os="${{ matrix.npmOs }}" --cpu="${{ matrix.npmCpu }}")
          cp -r "/tmp/harvest/node_modules/@anthropic-ai/claude-agent-sdk-${{ matrix.npmOs }}-${{ matrix.npmCpu }}" \
            node_modules/@anthropic-ai/
          echo "SDK $SDK_VERSION, variante ${{ matrix.npmOs }}-${{ matrix.npmCpu }} innestata."
      # Un formato solo (`tar.gz`) su ogni piattaforma, Windows compreso — `install.ps1`
      # lo estrae con lo stesso `tar` che Windows include dalla 1803 in poi, invece di
      # un secondo formato da gestire solo lì. Niente `--strip-components`: il
      # contenuto dell'archivio è già quello che deve finire dentro `$APP`.
      - name: Pacchetto
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/stark-${{ matrix.target }}.tar.gz" \
            src ui/dist node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: version.txt — quello che install.sh/stark update confrontano
        run: echo "$GITHUB_REF_NAME" > bundles/version.txt
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STARK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STARK_DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      # Due copie: `releases/<tag>/` per chi vuole un bundle preciso (a mano, o un
      # giorno per una lista di versioni), `releases/latest/` per install.sh e
      # `stark update`, che non sanno né devono sapere quale sia il tag più recente
      # prima di chiederlo. `/opt/stark-cloud/www` è la cartella che il container
      # `home` (nginx, dietro Traefik) serve già su `starkapp.dev` — non un webserver
      # nuovo, vedi docs/distribuzione.md. La chiave di deploy è ristretta con
      # `rrsync` a quella cartella e basta.
      # L'IP diretto e non l'hostname: `starkapp.dev` è dietro Cloudflare proxato
      # (utile per il CDN sui bundle), e l'SSH su quell'hostname non arriva da
      # nessuna parte — Cloudflare inoltra solo HTTP(S).
      #
      # Percorso **relativo**, non `/opt/stark-cloud/www/releases/...`: `rrsync`
      # antepone da sé la radice configurata (`-wo /opt/stark-cloud/www/` in
      # `authorized_keys`) a qualunque percorso il client mandi — un percorso già
      # assoluto raddoppia il prefisso invece di sostituirlo. Misurato dal vivo:
      # `mkdir ".../www/opt/stark-cloud/www/releases/..." failed`.
      - name: Pubblica su starkapp.dev
        run: |
          rsync -av --delete bundles/ "deploy@45.77.53.112:releases/$GITHUB_REF_NAME/"
          rsync -av --delete bundles/ "deploy@45.77.53.112:releases/latest/"
