name: Pubblica installer

# install.sh/install.ps1 sono la porta d'ingresso — https://starkapp.dev/install.sh —
# e cambiano raramente, indipendentemente dalle release: seguono ogni push che li
# tocca, non i tag. È la stessa distinzione che il progetto fa altrove fra «cosa segue
# ogni push» e «cosa segue solo una release» (docs/rilascio.md).
#
# `deploy-starkapp` e non `main`, per ora: main locale ha altro lavoro non ancora
# pushato, e agganciare il trigger lì costringerebbe a spingerlo tutto solo per
# provare questa pipeline. Il branch è la superficie di collaudo finché il VPS e il
# DNS non sono pronti — vedi docs/distribuzione.md. Va spostato su `main` (o
# aggiunto accanto) una volta che l'infrastruttura è verificata dal vivo.
on:
  push:
    branches: [deploy-starkapp]
    paths: ['install.sh', 'install.ps1']
  # Per ripubblicare senza dover toccare install.sh/install.ps1 solo per far scattare
  # il filtro sui path qui sopra — è servito la prima volta che questo workflow è
  # girato: il push era partito con STARK_DEPLOY_HOST_KEY ancora vuoto ("Host key
  # verification failed"), e nessun commit successivo toccava questi due file.
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STARK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STARK_DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      # /opt/stark-cloud/www è la cartella che il container `home` serve già su
      # starkapp.dev (vedi docs/distribuzione.md) — non un webserver nuovo. L'IP
      # diretto e non l'hostname: stessa ragione di publish-release.yml.
      #
      # Destinazione `deploy@45.77.53.112:` (radice **relativa**, non
      # `/opt/stark-cloud/www/`): `rrsync` antepone da sé la radice configurata a
      # qualunque percorso il client mandi, quindi un percorso già assoluto la
      # raddoppia — stessa causa, stesso fix di publish-release.yml.
      - name: Pubblica su starkapp.dev
        run: rsync -av install.sh install.ps1 "deploy@45.77.53.112:"
