# Il server cloud di STARK sul VPS, dietro Traefik.
#
# A differenza dell'accesso fuori casa (che usa mTLS perché è privato), il cloud è un
# servizio **multi-utente pubblico** (email+password): usa TLS normale via letsencrypt.
# Il dominio va sostituito con il tuo.
#
#   docker compose -f cloud/docker-compose.yml up -d cloud
#
# Dati (account e sessioni) in un volume: sopravvivono al ricambio del container.

services:
  cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8787
      - CLOUD_DATA=/data
    volumes:
      - cloud-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stark-cloud.rule=Host(`cloud.tuodominio.it`)"
      - "traefik.http.routers.stark-cloud.entrypoints=websecure"
      - "traefik.http.routers.stark-cloud.tls.certresolver=letsencrypt"
      - "traefik.http.services.stark-cloud.loadbalancer.server.port=8787"

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=tuo@email.it"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
    ports:
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - letsencrypt:/letsencrypt

volumes:
  cloud-data:
  letsencrypt:
