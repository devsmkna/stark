<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <!-- Il manifest e l'icona non sono un vezzo da «app installabile»: su iOS le
         notifiche push arrivano **solo** a un sito aggiunto alla schermata Home, e senza
         queste due righe non c'è modo di aggiungercelo come si deve (l'icona diventa uno
         screenshot della pagina). `apple-touch-icon` è la riga che iOS guarda davvero:
         il manifest da solo, lì, non basta. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icona-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STARK" />
    <meta name="theme-color" content="#0E1118" />
    <title>STARK</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
