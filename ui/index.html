<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- Il manifest e l'icona non sono un vezzo da «app installabile»: su iOS le
         notifiche push arrivano **solo** a un sito aggiunto alla schermata Home, e senza
         queste due righe non c'è modo di aggiungercelo come si deve (l'icona diventa uno
         screenshot della pagina). `apple-touch-icon` è la riga che iOS guarda davvero:
         il manifest da solo, lì, non basta. -->
    <!-- `crossorigin="use-credentials"` non è un dettaglio: per specifica il manifest
         viene richiesto **senza cookie**, e il nostro sta dietro il guard — quindi
         tornava 403, iOS restava senza manifest e ripiegava sull'indirizzo della pagina
         come `start_url`. Che a quel punto è `/` nudo, perché il token l'abbiamo appena
         tolto dalla barra: l'app della schermata Home partiva senza credenziale.
         Con questo attributo la richiesta porta il cookie, il manifest arriva davvero, e
         `start_url` è quello composto dal daemon — col token dentro. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icona-180.png" />
    <!-- La favicon è lo stesso segno delle icone dell'app — la «A» di `Logo.svelte` —
         ma su fondo **chiaro**, perché sta nella barra delle schede e non su una
         schermata Home: lì un quadratino scuro sarebbe una macchia, non un marchio.
         Le due righe sono una sola icona in due formati: l'SVG è quello vero (una
         scheda la disegna a 16, a 32 e al doppio su schermo denso, e un vettore le
         regge tutte), il PNG è il ripiego per chi l'SVG non lo guarda. Chi capisce
         entrambi prende l'ultimo dichiarato, quindi l'SVG va dopo.
         Si rigenerano con `node tools/gen-app-icons.mjs`: il sorgente resta il logo. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STARK" />
    <meta name="theme-color" content="#0E1118" />
    <title>STARK</title>
    <!-- Splash pre-JS: è la prima cosa che si vede da mobile con una connessione
         lenta, quando il bundle sta ancora arrivando. Il mount svuota #app
         (main.ts) e la UI mostra lo stesso disegno col `Splash.svelte` vero, quindi
         non si cambia mai forma: da "STARK che respira" a "STARK che respira". -->
    <style>
      #carica{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:#FFFFFF;color:#171A22}
      @media (prefers-color-scheme:dark){#carica{background:#0E1118;color:#E8EAF0}}
      #carica .mark{height:clamp(34px,8vw,50px);animation:respiro 2s ease-in-out infinite}
      #carica .mark svg{display:block;height:100%;width:auto}
      /* Neon, non nuvola: raggi corti e concentrici che restano attaccati ai tratti.
           Con blur da 30-48px le ombre delle cinque lettere si fondevano in un
           rettangolo pieno dietro la parola — visto nello screenshot Chromium e
           segnalato dall'utente (1º settembre 2026). Niente calo di opacità: le
           lettere restano accese, respira solo il bagliore. */
      @keyframes respiro{
        0%,100%{filter:drop-shadow(0 0 2px rgba(122,146,255,.55)) drop-shadow(0 0 7px rgba(122,146,255,.32))}
        50%{filter:drop-shadow(0 0 3px rgba(122,146,255,.85)) drop-shadow(0 0 10px rgba(122,146,255,.5)) drop-shadow(0 0 26px rgba(122,146,255,.25))}
      }
    </style>
  </head>
